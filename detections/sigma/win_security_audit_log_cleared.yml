title: Security Event Log Cleared
id: 01e595ae-10ef-405a-ac0e-81ed5642cc27
status: experimental
description: |
  Detects Event ID 1102, written when the Security log is cleared. Attackers clear logs to
  cover their tracks; legitimate clearing should be rare and change-managed.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: YOUR_NAME
date: 2026-10-29
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Planned maintenance or lab rebuilds (should have a change ticket)
level: high
