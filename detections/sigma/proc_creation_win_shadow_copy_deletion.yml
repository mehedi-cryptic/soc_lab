title: Volume Shadow Copy Deletion
id: fab5266b-0aab-4311-95fa-22b8d6ab0b1e
status: experimental
description: |
  Detects deletion of Volume Shadow Copies or disabling of Windows recovery. Ransomware
  almost always does this right before encrypting files, so treat it as critical.
references:
  - https://attack.mitre.org/techniques/T1490/
author: YOUR_NAME
date: 2026-10-29
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains: 'recoveryenabled no'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains: 'delete catalog'
  condition: 1 of selection_*
falsepositives:
  - Very rare; backup administrators cleaning up storage
level: critical
