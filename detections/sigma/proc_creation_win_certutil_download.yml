title: Certutil Used to Download a File
id: 5a0ad155-445b-4fda-84bd-a27b336398e1
status: experimental
description: |
  Detects certutil.exe with -urlcache or -verifyctl and a URL. Certutil is a signed Windows
  binary ("LOLBin") that attackers abuse to pull second-stage payloads.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: YOUR_NAME
date: 2026-10-29
tags:
  - attack.command-and-control
  - attack.t1105
  - attack.defense-evasion
  - attack.t1218
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_flags:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Rare legitimate certificate revocation list downloads by admins
level: high
