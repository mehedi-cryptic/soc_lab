title: DCSync - Directory Replication Requested by Non-DC Account
id: f6833807-39d4-45f2-bf84-77c702792452
status: experimental
description: |
  Detects Event ID 4662 where an account requests Active Directory replication rights
  (DS-Replication-Get-Changes / Get-Changes-All). Domain controllers do this normally, but
  when a user account does it, it usually means Mimikatz "lsadump::dcsync" or Impacket
  secretsdump.py is pulling password hashes (including krbtgt) straight from AD.
references:
  - https://attack.mitre.org/techniques/T1003/006/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4662
author: YOUR_NAME
date: 2026-11-03
tags:
  - attack.credential-access
  - attack.t1003.006
logsource:
  product: windows
  service: security
  definition: 'Requires "Audit Directory Service Access" on domain controllers and a SACL on the domain object'
detection:
  selection:
    EventID: 4662
    AccessMask: '0x100'
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes-All
      - '89e95b76-444d-4c62-991a-0facbeda640c'  # DS-Replication-Get-Changes-In-Filtered-Set
  filter_main_dc_accounts:
    SubjectUserName|endswith: '$'
  filter_optional_aad_connect:
    SubjectUserName|startswith: 'MSOL_'
  condition: selection and not 1 of filter_*
falsepositives:
  - Azure AD / Entra Connect sync account (MSOL_*) - filtered above, verify the name in your domain
  - Backup or identity tools that read AD with replication rights
level: high