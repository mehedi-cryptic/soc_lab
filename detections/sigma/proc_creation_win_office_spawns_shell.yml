title: Microsoft Office Application Spawning a Shell or Script Host
id: 063e4cda-2f37-4b65-97cb-319294a5d27a
status: experimental
description: |
  Detects Word, Excel, PowerPoint or Outlook launching cmd, PowerShell or a script host.
  This parent-child pattern is a classic sign of a malicious macro from a phishing attachment.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
author: YOUR_NAME
date: 2026-10-29
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - Rare; some legacy add-ins call cmd.exe. Investigate every hit.
level: high
