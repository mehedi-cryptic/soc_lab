title: Domain and Privilege Discovery Commands
id: b781c67b-02e7-4ff5-bc6e-43e95b283db8
status: experimental
description: |
  Detects common post-exploitation reconnaissance: enumerating domain admins, domain trusts
  and the current user's privileges. A single command is weak evidence; several from the
  same host within minutes is a strong signal (see triage-tool scoring).
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1482/
  - https://attack.mitre.org/techniques/T1033/
author: YOUR_NAME
date: 2026-10-29
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1482
  - attack.t1033
logsource:
  product: windows
  category: process_creation
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - 'group "domain admins"'
      - 'group "enterprise admins"'
      - 'group /domain'
      - 'user /domain'
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/domain_trusts'
      - '/dclist'
  selection_whoami:
    Image|endswith: '\whoami.exe'
    CommandLine|contains:
      - '/all'
      - '/priv'
      - '/groups'
  condition: 1 of selection_*
falsepositives:
  - Helpdesk and admin troubleshooting
  - Login scripts
level: low
